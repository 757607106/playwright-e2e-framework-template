name: E2E Framework Quality

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  static-quality:
    name: Static quality gates
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run static quality gates
        run: npm run quality:ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run self-contained smoke test
        run: npm run test:smoke
