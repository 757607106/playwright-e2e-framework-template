name: E2E Framework Quality

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  framework:
    name: ${{ matrix.os }} / Node ${{ matrix.node }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            node: 22
          - os: windows-latest
            node: 24
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run release:check
      - run: npx playwright install --with-deps chromium
      - run: npm run test:adoption
      - run: npm run test:lifecycle
      - run: npm test
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: framework-reports-${{ matrix.os }}-node-${{ matrix.node }}
          path: |
            artifacts/quality-report
            artifacts/playwright-report
            artifacts/test-results
          retention-days: 7
          if-no-files-found: ignore
